name: images

on:
  push:
    branches: [main]
    paths:
      - images/**
      - '!images/**.md'
      - .github/workflows/images.yml
      - .github/scripts/discover_images.py
  pull_request:
    paths:
      - images/**
      - '!images/**.md'
      - .github/workflows/images.yml
      - .github/scripts/discover_images.py
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: docker.io
  NAMESPACE: nuonco
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover images
        id: discover
        run: python3 .github/scripts/discover_images.py --root images

  build:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.name }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
          tags: |
            type=sha,format=long
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ matrix.version }},enable=${{ matrix.version != '' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' && matrix.version == '' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' && matrix.version == '' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            NUON_VERSION=${{ matrix.version }}
          cache-from: type=gha,scope=images-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=images-${{ matrix.name }}
          provenance: mode=max
          sbom: true

      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify signature
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/images.yml@" \
            "${IMAGE}@${DIGEST}" > /dev/null

      - name: Summarize
        if: always() && steps.build.outcome == 'success'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${IMAGE}"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "Built without pushing. Tags that would be published:"
            else
              echo "Pushed tags:"
            fi
            echo
            echo '```'
            printf '%s\n' "${TAGS}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  docs:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.ACTIONS_PR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Render docs for the published images
        env:
          RAW_VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -n "${RAW_VERSION}" ]; then
            python3 .github/scripts/gen_image_docs.py \
              --root images \
              --version "${RAW_VERSION}" \
              --ref "refs/tags/${RAW_VERSION}"
          else
            # Keeps the release already documented; only re-renders Dockerfile facts.
            python3 .github/scripts/gen_image_docs.py --root images
          fi

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PR_TOKEN || secrets.GITHUB_TOKEN }}
          RAW_VERSION: ${{ github.event.release.tag_name }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- images)" ]; then
            echo "Image docs are already current." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if [ -n "${RAW_VERSION}" ]; then
            version="${RAW_VERSION#v}"
            branch="image-docs/${version}"
            title="docs(images): document release ${version}"
            summary="Points every unpinned image at the tags \`${version}\` published, and at the signing identity of \`refs/tags/${RAW_VERSION}\`. Images pinned with \`org.opencontainers.image.version\` keep their own tag."
          else
            branch="image-docs/sync"
            title="docs(images): sync generated image docs"
            summary="Re-renders the generated regions against the Dockerfiles that just published. The documented release is unchanged."
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add -A images
          git commit -m "${title}"
          git push --force origin "${branch}"

          body="$(printf '%s\n' \
            "${summary}" \
            "" \
            "| | |" \
            "| --- | --- |" \
            "| trigger | \`${GITHUB_EVENT_NAME}\` |" \
            "| published from | \`${GITHUB_SHA}\` |" \
            "" \
            "Markdown under \`images/\` cannot trigger \`images.yml\`, so merging this" \
            "republishes nothing." \
            "" \
            "Opened by the \`docs\` job in \`.github/workflows/images.yml\`.")"

          existing="$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number')"
          if [ -n "${existing}" ] && [ "${existing}" != "null" ]; then
            gh pr edit "${existing}" --title "${title}" --body "${body}"
            url="$(gh pr view "${existing}" --json url --jq .url)"
          else
            url="$(gh pr create --base "${BASE}" --head "${branch}" --title "${title}" --body "${body}")"
          fi
          echo "${title}: ${url}" >> "${GITHUB_STEP_SUMMARY}"
